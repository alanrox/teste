<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Série de educação financeira</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
  // ?v=pasta/do/video (relativa a este arquivo) carrega dados.js daquela pasta.
  const p = new URLSearchParams(location.search);
  document.write('<script src="' + (p.get('v') || '.') + '/dados.js"><\/script>');
  document.write('<script src="motor.js"><\/script>');
</script>
<script>
  if (!new URLSearchParams(location.search).has('render')) {
    const start = performance.now();
    const loop = now => { render(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    document.fonts.ready.then(() => requestAnimationFrame(loop));
  }
</script>
</body>
</html>
